<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kids Alphabet Tracing</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+Devanagari:wght@700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      padding-top: max(6px, env(safe-area-inset-top));
      padding-bottom: max(6px, env(safe-area-inset-bottom));
      color: #2f3e46;
      touch-action: none;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 480px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    header h1 {
      font-size: 1.35rem;
      color: #333;
    }

    .lang-tabs {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .lang-btn {
      flex: 1;
      padding: 6px;
      font-size: 0.95rem;
      font-weight: bold;
      border: 3px solid transparent;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.85);
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.06);
    }

    .lang-btn.active {
      background: #ff7675;
      color: #fff;
      border-color: #d63031;
      transform: translateY(-2px);
    }

    .letter-picker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: #ffffff;
      padding: 4px 12px;
      border-radius: 18px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }

    .nav-arrow {
      background: #74b9ff;
      border: none;
      color: white;
      font-size: 1.2rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 3px #0984e3;
    }

    .nav-arrow:active {
      transform: translateY(3px);
      box-shadow: none;
    }

    .current-letter-display {
      font-size: 1.3rem;
      font-weight: bold;
      color: #2d3436;
      font-family: 'Noto Sans Devanagari', 'Fredoka', sans-serif;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 250px;
      max-height: 58vh;
      background: #ffffff;
      border-radius: 22px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      border: 5px solid #ffeaa7;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #drawCanvas { z-index: 2; }
    #particleCanvas { z-index: 3; pointer-events: none; }

    .crayon-palette {
      display: flex;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 2px 0;
    }

    .crayon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 3px 6px rgba(0,0,0,0.18);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .crayon.selected {
      transform: scale(1.2);
      border-color: #2d3436;
    }

    .progress-bar-container {
      width: 100%;
      height: 9px;
      background: #dfe6e9;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #00b894;
      transition: width 0.2s ease-out;
    }

    .action-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .action-btn {
      flex: 1;
      padding: 8px;
      font-size: 0.92rem;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px rgba(0,0,0,0.12);
    }

    .action-btn:active {
      transform: translateY(3px);
      box-shadow: none;
    }

    .btn-clear { background: #fab1a0; color: #d63031; }
    .btn-sound { background: #ffeaa7; color: #d35400; }

    /* Universal Robust Celebration Overlay */
    .celebration-overlay {
      position: absolute;
      inset: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.92);
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 10;
      padding: 10px 8px;
      text-align: center;
    }

    .celebration-overlay.show {
      opacity: 1 !important;
      transform: scale(1) !important;
      pointer-events: auto !important;
    }

    .celebration-letter {
      font-size: clamp(2.4rem, 9vh, 3.8rem);
      font-weight: 900;
      color: #ff7675;
      line-height: 1;
      font-family: 'Noto Sans Devanagari', 'Fredoka', sans-serif;
    }

    .celebration-emoji {
      font-size: clamp(3rem, 12vh, 4.8rem);
      line-height: 1;
      animation: pulseBounce 0.9s infinite alternate ease-in-out;
    }

    .celebration-word {
      font-size: clamp(1.6rem, 5.5vh, 2.4rem);
      font-weight: 800;
      color: #2d3436;
      line-height: 1.1;
      font-family: 'Noto Sans Devanagari', 'Fredoka', sans-serif;
    }

    .celebration-sub {
      font-size: clamp(1rem, 3.5vh, 1.35rem);
      color: #0984e3;
      font-weight: bold;
      font-family: 'Noto Sans Devanagari', 'Fredoka', sans-serif;
    }

    .celebration-timer-text {
      font-size: clamp(0.75rem, 2.4vh, 0.95rem);
      color: #2d3436;
      background: #ffeaa7;
      padding: 3px 14px;
      border-radius: 16px;
      font-weight: bold;
    }

    @keyframes pulseBounce {
      0% { transform: scale(0.94); }
      100% { transform: scale(1.12); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🎨 Magic Trace</h1>
    </header>

    <div class="lang-tabs">
      <button class="lang-btn active" onclick="switchLanguage('en', event)">English</button>
      <button class="lang-btn" onclick="switchLanguage('hi', event)">हिंदी</button>
      <button class="lang-btn" onclick="switchLanguage('mr', event)">मराठी</button>
    </div>

    <div class="letter-picker">
      <button class="nav-arrow" onclick="prevLetter()">◀</button>
      <div class="current-letter-display" id="letter-title">A - Apple</div>
      <button class="nav-arrow" onclick="nextLetter()">▶</button>
    </div>

    <div class="canvas-wrapper" id="canvasBox">
      <canvas id="guideCanvas"></canvas>
      <canvas id="drawCanvas"></canvas>
      <canvas id="particleCanvas"></canvas>

      <div class="celebration-overlay" id="celebrationCard">
        <div class="celebration-letter" id="vocab-letter">A</div>
        <div class="celebration-emoji" id="vocab-emoji">🍎</div>
        <div class="celebration-word" id="vocab-word">Apple</div>
        <div class="celebration-sub" id="vocab-phonics">A for Apple</div>
        <div class="celebration-timer-text">Next letter coming up... 🌟</div>
      </div>
    </div>

    <div class="crayon-palette">
      <div class="crayon selected" style="background: #ff7675;" onclick
