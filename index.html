<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kids Alphabet Tracing</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      color: #2f3e46;
      touch-action: none;
    }

    .container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 1.8rem;
      color: #333;
    }

    .lang-tabs {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .lang-btn {
      flex: 1;
      padding: 10px;
      font-size: 1.05rem;
      font-weight: bold;
      border: 3px solid transparent;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.85);
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.06);
    }

    .lang-btn.active {
      background: #ff7675;
      color: #fff;
      border-color: #d63031;
      transform: translateY(-2px);
    }

    .letter-picker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }

    .nav-arrow {
      background: #74b9ff;
      border: none;
      color: white;
      font-size: 1.4rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 4px #0984e3;
    }

    .nav-arrow:active {
      transform: translateY(4px);
      box-shadow: none;
    }

    .current-letter-display {
      font-size: 1.6rem;
      font-weight: bold;
      color: #2d3436;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      border: 6px solid #ffeaa7;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .progress-bar-container {
      width: 100%;
      height: 14px;
      background: #dfe6e9;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #00b894;
      transition: width 0.2s ease-out;
    }

    .action-row {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .action-btn {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 4px rgba(0,0,0,0.12);
    }

    .action-btn:active {
      transform: translateY(3px);
      box-shadow: none;
    }

    .btn-clear { background: #fab1a0; color: #d63031; }
    .btn-sound { background: #ffeaa7; color: #d35400; }

    /* Enlarged Celebration Overlay Card */
    .celebration-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.98);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.85);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 10;
      padding: 24px 16px;
      text-align: center;
    }

    .celebration-overlay.show {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .celebration-letter {
      font-size: 4.8rem;
      font-weight: 900;
      color: #ff7675;
      line-height: 1.1;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.08);
    }

    .celebration-emoji {
      font-size: 5.5rem;
      line-height: 1;
      animation: pulseBounce 0.9s infinite alternate ease-in-out;
    }

    .celebration-word {
      font-size: 2.6rem;
      font-weight: 800;
      color: #2d3436;
      line-height: 1.2;
    }

    .celebration-sub {
      font-size: 1.5rem;
      color: #0984e3;
      font-weight: bold;
    }

    .celebration-timer-text {
      font-size: 1rem;
      color: #2d3436;
      background: #ffeaa7;
      padding: 6px 18px;
      border-radius: 20px;
      font-weight: bold;
    }

    @keyframes pulseBounce {
      0% { transform: scale(0.92); }
      100% { transform: scale(1.18); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🎨 Magic Trace</h1>
    </header>

    <div class="lang-tabs">
      <button class="lang-btn active" onclick="switchLanguage('en', event)">English</button>
      <button class="lang-btn" onclick="switchLanguage('hi', event)">हिंदी</button>
      <button class="lang-btn" onclick="switchLanguage('mr', event)">मराठी</button>
    </div>

    <div class="letter-picker">
      <button class="nav-arrow" onclick="prevLetter()">◀</button>
      <div class="current-letter-display" id="letter-title">A - Apple</div>
      <button class="nav-arrow" onclick="nextLetter()">▶</button>
    </div>

    <div class="canvas-wrapper">
      <canvas id="traceCanvas"></canvas>
      
      <!-- Full-card Celebration Pop-up -->
      <div class="celebration-overlay" id="celebrationCard">
        <div class="celebration-letter" id="vocab-letter">A</div>
        <div class="celebration-emoji" id="vocab-emoji">🍎</div>
        <div class="celebration-word" id="vocab-word">Apple</div>
        <div class="celebration-sub" id="vocab-phonics">A for Apple</div>
        <div class="celebration-timer-text">Next letter coming up... 🌟</div>
      </div>
    </div>

    <div class="progress-bar-container">
      <div class="progress-fill" id="progressBar"></div>
    </div>

    <div class="action-row">
      <button class="action-btn btn-clear" onclick="clearCanvas()">🔄 Retry</button>
      <button class="action-btn btn-sound" onclick="playCurrentAudioPaced()">🔊 Hear Sound</button>
    </div>
  </div>

  <script>
    const datasets = {
      en: [
        { letter: 'A', word: 'Apple', phonic: 'A for Apple', emoji: '🍎', langCode: 'en-US' },
        { letter: 'B', word: 'Ball', phonic: 'B for Ball', emoji: '⚽', langCode: 'en-US' },
        { letter: 'C', word: 'Cat', phonic: 'C for Cat', emoji: '🐱', langCode: 'en-US' },
        { letter: 'D', word: 'Dog', phonic: 'D for Dog', emoji: '🐶', langCode: 'en-US' }
      ],
      hi: [
        { letter: 'अ', word: 'अनार', phonic: 'अ से अनार', emoji: '🍈', langCode: 'hi-IN' },
        { letter: 'आ', word: 'आम', phonic: 'आ से आम', emoji: '🥭', langCode: 'hi-IN' },
        { letter: 'इ', word: 'इमली', phonic: 'इ से इमली', emoji: '🫘', langCode: 'hi-IN' },
        { letter: 'क', word: 'कमल', phonic: 'क से कमल', emoji: '🪷', langCode: 'hi-IN' }
      ],
      mr: [
        { letter: 'अ', word: 'अननस', phonic: 'अ - अननस', emoji: '🍍', langCode: 'mr-IN' },
        { letter: 'क', word: 'कमळ', phonic: 'क - कमळ', emoji: '🪷', langCode: 'mr-IN' },
        { letter: 'घ', word: 'घर', phonic: 'घ - घर', emoji: '🏠', langCode: 'mr-IN' },
        { letter: 'ळ', word: 'बाळ', phonic: 'ळ - बाळ', emoji: '👶', langCode: 'mr-IN' }
      ]
    };

    let currentLang = 'en';
    let currentIndex = 0;
    let isDrawing = false;
    let isCompleted = false;
    let autoNextTimer = null;

    const canvas = document.getElementById('traceCanvas');
    const ctx = canvas.getContext('2d');
    
    let allTargetPoints = [];
    let strokeClusters = [];

    function initCanvasSize() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      renderLetter();
    }

    function getCurrentItem() {
      return datasets[currentLang][currentIndex];
    }

    function renderLetter() {
      if (autoNextTimer) clearTimeout(autoNextTimer);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();

      const item = getCurrentItem();
      const rect = canvas.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;

      ctx.clearRect(0, 0, width, height);

      const fontSize = Math.min(width, height) * 0.65;
      ctx.font = `bold ${fontSize}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Dashed guide outline
      ctx.setLineDash([10, 14]);
      ctx.lineWidth = 8;
      ctx.strokeStyle = '#b2bec3';
      ctx.strokeText(item.letter, width / 2, height / 2 + 6);

      // Light background fill
      ctx.fillStyle = 'rgba(238, 238, 238, 0.4)';
      ctx.fillText(item.letter, width / 2, height / 2 + 6);

      // Map letter points into dense checkpoints
      mapLetterPoints(item.letter, width, height, fontSize);

      document.getElementById('letter-title').textContent = `${item.letter} - ${item.word}`;
      document.getElementById('progressBar').style.width = '0%';
      document.getElementById('celebrationCard').classList.remove('show');
      isCompleted = false;
    }

    // Maps points and creates grid clusters across the letter's active area
    function mapLetterPoints(letter, width, height, fontSize) {
      const offCanvas = document.createElement('canvas');
      offCanvas.width = width;
      offCanvas.height = height;
      const offCtx = offCanvas.getContext('2d');

      offCtx.font = `bold ${fontSize}px sans-serif`;
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';
      offCtx.fillText(letter, width / 2, height / 2 + 6);

      const imgData = offCtx.getImageData(0, 0, width, height).data;
      allTargetPoints = [];

      let minX = width, maxX = 0, minY = height, maxY = 0;

      for (let y = 0; y < height; y += 8) {
        for (let x = 0; x < width; x += 8) {
          const index = (y * width + x) * 4;
          if (imgData[index + 3] > 100) {
            allTargetPoints.push({ x, y, hit: false });
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      if (allTargetPoints.length === 0) return;

      // Group checkpoints into 6 distinct spatial zones (Left-Top, Right-Top, Left-Mid, Right-Mid, Left-Bot, Right-Bot)
      strokeClusters = [];
      const midX = (minX + maxX) / 2;
      const stepY = (maxY - minY) / 3;

      const zoneBins = [[], [], [], [], [], []];
      allTargetPoints.forEach(pt => {
        const row = Math.min(2, Math.floor((pt.y - minY) / stepY));
        const col = pt.x <= midX ? 0 : 1;
        const binIndex = row * 2 + col;
        zoneBins[binIndex].push(pt);
      });

      // Keep only active bins containing actual strokes
      zoneBins.forEach(bin => {
        if (bin.length >= 6) {
          strokeClusters.push(bin);
        }
      });
    }

    function speakText(text, langCode, rate = 0.75, onEndCallback = null) {
      if (!('speechSynthesis' in window)) return;

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = langCode;
      utterance.rate = rate;
      utterance.pitch = 1.05;

      const voices = window.speechSynthesis.getVoices();
      const matched = voices.find(v => v.lang.startsWith(langCode.slice(0, 2)));
      if (matched) utterance.voice = matched;

      if (onEndCallback) {
        utterance.onend = onEndCallback;
      }

      window.speechSynthesis.speak(utterance);
    }

    function playCurrentAudioPaced(onComplete = null) {
      const item = getCurrentItem();
      window.speechSynthesis.cancel();

      speakText(item.letter, item.langCode, 0.7, () => {
        setTimeout(() => {
          speakText(item.phonic, item.langCode, 0.75, onComplete);
        }, 600);
      });
    }

    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDrawing(e) {
      if (isCompleted) return;
      isDrawing = true;
      const pos = getPointerPos(e);
      drawStroke(pos.x, pos.y, false);
    }

    function draw(e) {
      if (!isDrawing || isCompleted) return;
      e.preventDefault();
      const pos = getPointerPos(e);
      drawStroke(pos.x, pos.y, true);
    }

    function stopDrawing() {
      if (!isDrawing) return;
      isDrawing = false;
      ctx.beginPath();
      checkCompletionOnRelease();
    }

    function drawStroke(x, y, isMoving) {
      ctx.setLineDash([]);
      ctx.lineWidth = 32;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#ff7675';

      if (!isMoving) {
        ctx.beginPath();
        ctx.moveTo(x, y);
      }
      ctx.lineTo(x, y);
      ctx.stroke();

      const touchRadiusSq = 24 * 24;
      allTargetPoints.forEach(pt => {
        if (!pt.hit) {
          const dx = pt.x - x;
          const dy = pt.y - y;
          if (dx * dx + dy * dy <= touchRadiusSq) {
            pt.hit = true;
          }
        }
      });

      if (allTargetPoints.length > 0) {
        const totalHits = allTargetPoints.filter(p => p.hit).length;
        const pct = Math.min(95, Math.round((totalHits / allTargetPoints.length) * 100));
        document.getElementById('progressBar').style.width = `${pct}%`;
      }
    }

    function checkCompletionOnRelease() {
      if (isCompleted || allTargetPoints.length === 0 || strokeClusters.length === 0) return;

      const totalHits = allTargetPoints.filter(p => p.hit).length;
      const overallRatio = totalHits / allTargetPoints.length;

      // 100% Structural Check: EVERY active letter segment must have at least 55% coverage
      let allSegmentsDone = true;
      strokeClusters.forEach(cluster => {
        const clusterHits = cluster.filter(p => p.hit).length;
        if (clusterHits / cluster.length < 0.55) {
          allSegmentsDone = false;
        }
      });

      // Strict Completion Rule: Overall coverage >= 82% AND all segments covered
      if (overallRatio >= 0.82 && allSegmentsDone) {
        isCompleted = true;
        document.getElementById('progressBar').style.width = '100%';
        setTimeout(() => {
          triggerCelebration();
        }, 350);
      }
    }

    function triggerCelebration() {
      const item = getCurrentItem();

      document.getElementById('vocab-letter').textContent = item.letter;
      document.getElementById('vocab-emoji').textContent = item.emoji;
      document.getElementById('vocab-word').textContent = item.word;
      document.getElementById('vocab-phonics').textContent = item.phonic;
      document.getElementById('celebrationCard').classList.add('show');

      playCurrentAudioPaced(() => {
        autoNextTimer = setTimeout(() => {
          nextLetter();
        }, 3000);
      });
    }

    function switchLanguage(lang, e) {
      currentLang = lang;
      currentIndex = 0;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      renderLetter();
    }

    function nextLetter() {
      currentIndex = (currentIndex + 1) % datasets[currentLang].length;
      renderLetter();
    }

    function prevLetter() {
      currentIndex = (currentIndex - 1 + datasets[currentLang].length) % datasets[currentLang].length;
      renderLetter();
    }

    function clearCanvas() {
      renderLetter();
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', stopDrawing);

    window.addEventListener('resize', initCanvasSize);
    window.addEventListener('DOMContentLoaded', () => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {};
      }
      initCanvasSize();
    });
  </script>
</body>
</html>
