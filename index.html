<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kids Alphabet Tracing</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 12px;
      color: #2f3e46;
      touch-action: none;
    }

    .container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    header h1 {
      font-size: 1.5rem;
      color: #333;
    }

    .lang-tabs {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .lang-btn {
      flex: 1;
      padding: 7px;
      font-size: 0.95rem;
      font-weight: bold;
      border: 3px solid transparent;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.85);
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.06);
    }

    .lang-btn.active {
      background: #ff7675;
      color: #fff;
      border-color: #d63031;
      transform: translateY(-2px);
    }

    .letter-picker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: #ffffff;
      padding: 4px 12px;
      border-radius: 18px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }

    .nav-arrow {
      background: #74b9ff;
      border: none;
      color: white;
      font-size: 1.2rem;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 3px #0984e3;
    }

    .nav-arrow:active {
      transform: translateY(3px);
      box-shadow: none;
    }

    .current-letter-display {
      font-size: 1.35rem;
      font-weight: bold;
      color: #2d3436;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1.1;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      border: 6px solid #ffeaa7;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #drawCanvas { z-index: 2; }
    #particleCanvas { z-index: 3; pointer-events: none; }

    .crayon-palette {
      display: flex;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 2px 0;
    }

    .crayon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 3px 6px rgba(0,0,0,0.18);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .crayon.selected {
      transform: scale(1.22);
      border-color: #2d3436;
    }

    .progress-bar-container {
      width: 100%;
      height: 10px;
      background: #dfe6e9;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #00b894;
      transition: width 0.2s ease-out;
    }

    .action-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .action-btn {
      flex: 1;
      padding: 9px;
      font-size: 0.95rem;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px rgba(0,0,0,0.12);
    }

    .action-btn:active {
      transform: translateY(3px);
      box-shadow: none;
    }

    .btn-clear { background: #fab1a0; color: #d63031; }
    .btn-sound { background: #ffeaa7; color: #d35400; }

    .celebration-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.98);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.85);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
      padding: 20px 14px;
      text-align: center;
    }

    .celebration-overlay.show {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .celebration-letter {
      font-size: 5rem;
      font-weight: 900;
      color: #ff7675;
      line-height: 1;
    }

    .celebration-emoji {
      font-size: 6rem;
      line-height: 1;
      animation: pulseBounce 0.9s infinite alternate ease-in-out;
    }

    .celebration-word {
      font-size: 2.8rem;
      font-weight: 800;
      color: #2d3436;
      line-height: 1.1;
    }

    .celebration-sub {
      font-size: 1.55rem;
      color: #0984e3;
      font-weight: bold;
    }

    .celebration-timer-text {
      font-size: 1rem;
      color: #2d3436;
      background: #ffeaa7;
      padding: 5px 20px;
      border-radius: 18px;
      font-weight: bold;
    }

    @keyframes pulseBounce {
      0% { transform: scale(0.92); }
      100% { transform: scale(1.16); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🎨 Magic Trace</h1>

    <div class="lang-tabs">
      <button class="lang-btn active" onclick="switchLanguage('en', event)">English</button>
      <button class="lang-btn" onclick="switchLanguage('hi', event)">हिंदी</button>
      <button class="lang-btn" onclick="switchLanguage('mr', event)">मराठी</button>
    </div>

    <div class="letter-picker">
      <button class="nav-arrow" onclick="prevLetter()">◀</button>
      <div class="current-letter-display" id="letter-title">A - Apple</div>
      <button class="nav-arrow" onclick="nextLetter()">▶</button>
    </div>

    <div class="canvas-wrapper">
      <canvas id="guideCanvas"></canvas>
      <canvas id="drawCanvas"></canvas>
      <canvas id="particleCanvas"></canvas>

      <div class="celebration-overlay" id="celebrationCard">
        <div class="celebration-letter" id="vocab-letter">A</div>
        <div class="celebration-emoji" id="vocab-emoji">🍎</div>
        <div class="celebration-word" id="vocab-word">Apple</div>
        <div class="celebration-sub" id="vocab-phonics">A for Apple</div>
        <div class="celebration-timer-text">Next letter coming up... 🌟</div>
      </div>
    </div>

    <div class="crayon-palette">
      <div class="crayon selected" style="background: #ff7675;" onclick="selectCrayon('#ff7675', this)"></div>
      <div class="crayon" style="background: #fdcb6e;" onclick="selectCrayon('#fdcb6e', this)"></div>
      <div class="crayon" style="background: #00b894;" onclick="selectCrayon('#00b894', this)"></div>
      <div class="crayon" style="background: #0984e3;" onclick="selectCrayon('#0984e3', this)"></div>
      <div class="crayon" style="background: #a29bfe;" onclick="selectCrayon('#a29bfe', this)"></div>
    </div>

    <div class="progress-bar-container">
      <div class="progress-fill" id="progressBar"></div>
    </div>

    <div class="action-row">
      <button class="action-btn btn-clear" onclick="clearCanvas()">🔄 Retry</button>
      <button class="action-btn btn-sound" onclick="playCurrentAudioPaced()">🔊 Hear Sound</button>
    </div>
  </div>

        { letter: 'य', word: 'यज्ञ', phonic: 'य - यज्ञ', emoji: '🔥', langCode: 'mr-IN' },
        { letter: 'र', word: 'रवी', phonic: 'र - रवी', emoji: '☀️', langCode: 'mr-IN' },
        { letter: 'ल', word: 'लसूण', phonic: 'ल - लसूण', emoji: '🧄', langCode: 'mr-IN' },
        { letter: 'व', word: 'वड', phonic: 'व - वड', emoji: '🌳', langCode: 'mr-IN' },
        { letter: 'श', word: 'शहामृग', phonic: 'श - शहामृग', emoji: '𦤤', langCode: 'mr-IN' },
        { letter: 'ष', word: 'षटकोन', phonic: 'ष - षटकोन', emoji: '⬡', langCode: 'mr-IN' },
        { letter: 'स', word: 'ससा', phonic: 'स - ससा', emoji: '🐰', langCode: 'mr-IN' },
        { letter: 'ह', word: 'हत्ती', phonic: 'ह - हत्ती', emoji: '🐘', langCode: 'mr-IN' },
        { letter: 'ळ', word: 'बाळ', phonic: 'ळ - बाळ', emoji: '👶', langCode: 'mr-IN' },
        { letter: 'क्ष', word: 'क्षत्रिय', phonic: 'क्ष - क्षत्रिय', emoji: '⚔️', langCode: 'mr-IN' },
        { letter: 'ज्ञ', word: 'ज्ञानेश्वर', phonic: 'ज्ञ - ज्ञानेश्वर', emoji: '📖', langCode: 'mr-IN' }
      ]
    };

    let currentLang = 'en';
    let currentIndex = 0;
    let isDrawing = false;
    let isCompleted = false;
    let autoNextTimer = null;
    let activeCrayon = '#ff7675';

    const gCanvas = document.getElementById('guideCanvas');
    const gCtx = gCanvas.getContext('2d');
    const dCanvas = document.getElementById('drawCanvas');
    const dCtx = dCanvas.getContext('2d');
    const pCanvas = document.getElementById('particleCanvas');
    const pCtx = pCanvas.getContext('2d');

    let allTargetPoints = [];
    let strokeClusters = [];
    let particles = [];

    function initCanvasSize() {
      const rect = dCanvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      
      [gCanvas, dCanvas, pCanvas].forEach(c => {
        c.width = rect.width * dpr;
        c.height = rect.height * dpr;
        c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
      });

      renderLetter();
    }

    function getCurrentItem() {
      return datasets[currentLang][currentIndex];
    }

    function selectCrayon(color, el) {
      activeCrayon = color;
      document.querySelectorAll('.crayon').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
    }

    function calculateBestFontSize(letter, width, height) {
      let size = Math.min(width * 0.70, height * 0.62);
      gCtx.font = `bold ${size}px sans-serif`;
      let textWidth = gCtx.measureText(letter).width;
      const maxAllowedWidth = width - 68;

      if (textWidth > maxAllowedWidth) {
        size = size * (maxAllowedWidth / textWidth);
      }
      return size;
    }

    function renderLetter() {
      if (autoNextTimer) clearTimeout(autoNextTimer);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();

      const item = getCurrentItem();
      const rect = dCanvas.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;

      gCtx.clearRect(0, 0, width, height);
      dCtx.clearRect(0, 0, width, height);
      pCtx.clearRect(0, 0, width, height);
      particles = [];

      const fontSize = calculateBestFontSize(item.letter, width, height);
      const fontStr = `bold ${fontSize}px sans-serif`;
      const centerX = width / 2;
      const centerY = height / 2 + 4;

      // 1. Hollow Track Shell
      const maskCanvas = document.createElement('canvas');
      maskCanvas.width = width;
      maskCanvas.height = height;
      const mCtx = maskCanvas.getContext('2d');

      mCtx.font = fontStr;
      mCtx.textAlign = 'center';
      mCtx.textBaseline = 'middle';

      mCtx.lineJoin = 'round';
      mCtx.lineCap = 'round';
      mCtx.lineWidth = 42;
      mCtx.strokeStyle = '#2d3436';
      mCtx.strokeText(item.letter, centerX, centerY);
      mCtx.fillStyle = '#2d3436';
      mCtx.fillText(item.letter, centerX, centerY);

      mCtx.globalCompositeOperation = 'destination-out';
      mCtx.lineWidth = 36;
      mCtx.strokeText(item.letter, centerX, centerY);
      mCtx.fillText(item.letter, centerX, centerY);

      gCtx.drawImage(maskCanvas, 0, 0);

      // 2. Centered Dotted Blue Path
      gCtx.font = fontStr;
      gCtx.textAlign = 'center';
      gCtx.textBaseline = 'middle';
      gCtx.setLineDash([8, 10]);
      gCtx.lineWidth = 3.5;
      gCtx.strokeStyle = '#74b9ff';
      gCtx.strokeText(item.letter, centerX, centerY);

      mapLetterPointsAndBadges(item.letter, width, height, fontSize, centerX, centerY);

      document.getElementById('letter-title').textContent = `${item.letter} - ${item.word}`;
      document.getElementById('progressBar').style.width = '0%';
      document.getElementById('celebrationCard').classList.remove('show');
      isCompleted = false;
    }

    function mapLetterPointsAndBadges(letter, width, height, fontSize, cx, cy) {
      const offCanvas = document.createElement('canvas');
      offCanvas.width = width;
      offCanvas.height = height;
      const offCtx = offCanvas.getContext('2d');

      offCtx.font = `bold ${fontSize}px sans-serif`;
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';
      offCtx.fillText(letter, cx, cy);

      const imgData = offCtx.getImageData(0, 0, width, height).data;
      allTargetPoints = [];

      let minX = width, maxX = 0, minY = height, maxY = 0;

      for (let y = 0; y < height; y += 8) {
        for (let x = 0; x < width; x += 8) {
          const index = (y * width + x) * 4;
          if (imgData[index + 3] > 100) {
            allTargetPoints.push({ x, y, hit: false });
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      if (allTargetPoints.length === 0) return;

      strokeClusters = [];
      const stepX = (maxX - minX) / 3;
      const stepY = (maxY - minY) / 3;

      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const x0 = minX + c * stepX;
          const x1 = (c === 2) ? maxX + 1 : x0 + stepX;
          const y0 = minY + r * stepY;
          const y1 = (r === 2) ? maxY + 1 : y0 + stepY;

          const ptsInCell = allTargetPoints.filter(p => p.x >= x0 && p.x < x1 && p.y >= y0 && p.y < y1);
          if (ptsInCell.length >= 5) {
            strokeClusters.push(ptsInCell);
          }
        }
      }

      drawAnatomicalStrokes(letter, minX, maxX, minY, maxY);
    }

    // Complete Devanagari & Latin Stroke Engine with Curved Directional Arrows
    function drawAnatomicalStrokes(letter, minX, maxX, minY, maxY) {
      gCtx.setLineDash([]);
      const midX = (minX + maxX) / 2;
      const midY = (minY + maxY) / 2;

      function renderBadge(num, x, y) {
        gCtx.beginPath();
        gCtx.arc(x, y, 12, 0, Math.PI * 2);
        gCtx.fillStyle = '#0984e3';
        gCtx.fill();
        gCtx.lineWidth = 2.5;
        gCtx.strokeStyle = '#ffffff';
        gCtx.stroke();

        gCtx.font = 'bold 13px sans-serif';
        gCtx.fillStyle = '#ffffff';
        gCtx.textAlign = 'center';
        gCtx.textBaseline = 'middle';
        gCtx.fillText(num, x, y + 0.5);
      }

      function drawArrow(fromX, fromY, toX, toY) {
        const headlen = 11;
        const angle = Math.atan2(toY - fromY, toX - fromX);

        gCtx.beginPath();
        gCtx.moveTo(fromX, fromY);
        gCtx.lineTo(toX, toY);
        gCtx.strokeStyle = '#d63031';
        gCtx.lineWidth = 3;
        gCtx.lineCap = 'round';
        gCtx.stroke();

        gCtx.beginPath();
        gCtx.moveTo(toX, toY);
        gCtx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
        gCtx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
        gCtx.lineTo(toX, toY);
        gCtx.fillStyle = '#d63031';
        gCtx.fill();
      }

      function drawArcArrow(cx, cy, r, startAngle, endAngle, counterClockwise = false) {
        gCtx.beginPath();
        gCtx.arc(cx, cy, r, startAngle, endAngle, counterClockwise);
        gCtx.strokeStyle = '#d63031';
        gCtx.lineWidth = 3;
        gCtx.stroke();

        const endX = cx + r * Math.cos(endAngle);
        const endY = cy + r * Math.sin(endAngle);
        const tangent = endAngle + (counterClockwise ? -Math.PI / 2 : Math.PI / 2);
        const headlen = 10;

        gCtx.beginPath();
        gCtx.moveTo(endX, endY);
        gCtx.lineTo(endX - headlen * Math.cos(tangent - Math.PI / 6), endY - headlen * Math.sin(tangent - Math.PI / 6));
        gCtx.lineTo(endX - headlen * Math.cos(tangent + Math.PI / 6), endY - headlen * Math.sin(tangent + Math.PI / 6));
        gCtx.fillStyle = '#d63031';
        gCtx.fill();
      }

      // --- 1. Devanagari Script (Hindi & Marathi) ---
      if (currentLang !== 'en') {
        // Group A: 'S' Curve Letters (इ, ई, ड, ङ, झ, ज्ञ, ऋ, ह)
        if (['इ', 'ई', 'ड', 'ङ', 'झ', 'ज्ञ', 'ऋ', 'ह'].includes(letter)) {
          // 1: Neck down
          renderBadge('1', midX, minY + 14);
          drawArrow(midX, minY + 26, midX, minY + (maxY - minY) * 0.28);
          // 2: Top Loop Right
          renderBadge('2', minX + 16, minY + (maxY - minY) * 0.32);
          drawArcArrow(midX + 2, minY + (maxY - minY) * 0.36, 20, -Math.PI / 2, Math.PI / 3, false);
          // 3: Bottom Loop Left & Tail Hook
          renderBadge('3', maxX - 18, minY + (maxY - minY) * 0.58);
          drawArcArrow(midX - 2, minY + (maxY - minY) * 0.68, 22, -Math.PI / 4, Math.PI * 0.75, true);
          // 4: Top Shirorekha
          renderBadge('4', minX + 10, minY + 6);
          drawArrow(minX + 22, minY + 6, maxX - 8, minY + 6);
          // For 'ई', show upper matra curve
          if (letter === 'ई') {
            renderBadge('5', midX + 12, minY - 10);
            drawArcArrow(midX + 26, minY - 6, 16, Math.PI, Math.PI * 1.8, false);
          }
        }
        // Group B: '3' Curve Vowels (अ, आ, उ, ऊ, ओ, औ, अं, अः)
        else if (['अ', 'आ', 'उ', 'ऊ', 'ओ', 'औ', 'अं', 'अः'].includes(letter)) {
          // 1: Upper Curve
          renderBadge('1', minX + 16, minY + (maxY - minY) * 0.22);
          drawArcArrow(minX + 34, minY + (maxY - minY) * 0.24, 20, -Math.PI / 2, Math.PI / 3, false);
          // 2: Lower Curve
          renderBadge('2', minX + 16, minY + (maxY - minY) * 0.54);
          drawArcArrow(minX + 34, minY + (maxY - minY) * 0.56, 22, -Math.PI / 2, Math.PI / 3, false);
          // Check if letter has middle connector & vertical spine
          if (['अ', 'आ', 'ओ', 'औ', 'अं', 'अः'].includes(letter)) {
            renderBadge('3', minX + (maxX - minX) * 0.38, midY + 4);
            drawArrow(minX + (maxX - minX) * 0.44, midY + 4, minX + (maxX - minX) * 0.65, midY + 4);
            renderBadge('4', maxX - 20, minY + 16);
            drawArrow(maxX - 20, minY + 28, maxX - 20, maxY - 16);
            renderBadge('5', minX + 10, minY + 6);
            drawArrow(minX + 22, minY + 6, maxX - 8, minY + 6);
          } else {
            // For उ / ऊ: Top Shirorekha
            renderBadge('3', minX + 10, minY + 6);
            drawArrow(minX + 22, minY + 6, maxX - 8, minY + 6);
          }
        }
        // Group C: 'C' Curve Letters (ट, ठ, ढ, द)
        else if (['ट', 'ठ', 'ढ', 'द'].includes(letter)) {
          renderBadge('1', midX, minY + 14);
          drawArrow(midX, minY + 26, midX, minY + (maxY - minY) * 0.30);
          renderBadge('2', minX + 16, minY + (maxY - minY) * 0.45);
          drawArcArrow(midX, midY + 6, (maxX - minX) * 0.42, -Math.PI / 2, Math.PI * 0.85, false);
          renderBadge('3', minX + 10, minY + 6);
          drawArrow(minX + 22, minY + 6, maxX - 8, minY + 6);
        }
        // Group D: 'क'
        else if (letter === 'क') {
          renderBadge('1', midX, minY + 14);
          drawArrow(midX, minY + 26, midX, maxY - 16);
          renderBadge('2', minX + 16, midY - 14);
          drawArcArrow(minX + 34, midY - 6, 18, 0, Math.PI * 1.5, true);
          renderBadge('3', maxX - 14, midY + 4);
          drawArcArrow(midX + 22, midY + 14, 20, -Math.PI / 2, Math.PI / 3, false);
          renderBadge('4', minX + 12, minY + 6);
          drawArrow(minX + 24, minY + 6, maxX - 10, minY + 6);
        }
        // Group E: Double-Curve Letters (घ, छ, ध, थ)
        else if (['घ', 'छ', 'ध', 'थ'].includes(letter)) {
          renderBadge('1', minX + 16, minY + (maxY - minY) * 0.24);
          drawArcArrow(minX + 32, minY + (maxY - minY) * 0.26, 18, -Math.PI / 2, Math.PI / 3, false);
          renderBadge('2', minX + 16, minY + (maxY - minY) * 0.52);
          drawArcArrow(minX + 32, minY + (maxY - minY) * 0.54, 20, -Math.PI / 2, Math.PI / 3, false);
          renderBadge('3', maxX - 18, minY + 16);
          drawArrow(maxX - 18, minY + 28, maxX - 18, maxY - 16);
          renderBadge('4', minX + 10, minY + 6);
          drawArrow(minX + 22, minY + 6, maxX - 8, minY + 6);
        }
        // Group F: Marathi ळ
        else if (letter === 'ळ') {
          renderBadge('1', minX + 16, midY);
          drawArcArrow(minX + 32, midY + 6, 18, 0, Math.PI * 1.5, true);
          renderBadge('2', midX + 6, midY);
          drawArcArrow(midX + 22, midY + 6, 18, 0, Math.PI * 1.5, true);
          renderBadge('3', maxX - 18, minY + 16);
          drawArrow(maxX - 18, minY + 28, maxX - 18, maxY - 16);
          renderBadge('4', minX + 10, minY + 6);
          drawArrow(minX + 22, minY + 6, maxX - 8, minY + 6);
        }
        // Default Devanagari (Spine + Loops: ग, म, न, त, प, व, ब, etc.)
        else {
          renderBadge('1', minX + 16, minY + 24);
          drawArrow(minX + 16, minY + 36, minX + 16, maxY - 24);
          renderBadge('2', maxX - 18, minY + 16);
          drawArrow(maxX - 18, minY + 28, maxX - 18, maxY - 16);
          renderBadge('3', minX + 10, minY + 6);
          drawArrow(minX + 22, minY + 6, maxX - 8, minY + 6);
        }
      } 
      // --- 2. English Alphabet Rules ---
      else {
        if (letter === 'A') {
          renderBadge('1', midX - 8, minY + 12);
          drawArrow(midX - 16, minY + 24, minX + 12, maxY - 12);
          renderBadge('2', midX + 8, minY + 12);
          drawArrow(midX + 16, minY + 24, maxX - 12, maxY - 12);
          renderBadge('3', minX + (maxX - minX) * 0.28, midY + 12);
          drawArrow(minX + (maxX - minX) * 0.36, midY + 12, minX + (maxX - minX) * 0.72, midY + 12);
        } else if (letter === 'B') {
          renderBadge('1', minX + 10, minY + 10);
          drawArrow(minX + 10, minY + 22, minX + 10, maxY - 14);
          renderBadge('2', minX + 28, minY + 8);
          drawArcArrow(midX + 8, minY + (maxY - minY) * 0.28, 24, -Math.PI / 2, Math.PI / 2);
          renderBadge('3', minX + 28, midY + 4);
          drawArcArrow(midX + 8, minY + (maxY - minY) * 0.72, 26, -Math.PI / 2, Math.PI / 2);
        } else if (letter === 'C') {
          renderBadge('1', maxX - 14, minY + 18);
          drawArcArrow(midX, midY, (maxX - minX) * 0.44, -Math.PI / 4, Math.PI * 0.85, true);
        } else if (letter === 'D') {
          renderBadge('1', minX + 10, minY + 10);
          drawArrow(minX + 10, minY + 22, minX + 10, maxY - 14);
          renderBadge('2', minX + 28, minY + 8);
          drawArcArrow(midX + 4, midY, (maxX - minX) * 0.46, -Math.PI / 2, Math.PI / 2);
        } else if (letter === 'G') {
          renderBadge('1', maxX - 14, minY + 18);
          drawArcArrow(midX, midY, (maxX - minX) * 0.44, -Math.PI / 4, Math.PI * 0.78, true);
          renderBadge('2', maxX - 8, midY + 4);
          drawArrow(maxX - 8, midY + 4, midX + 6, midY + 4);
        } else if (letter === 'J') {
          renderBadge('1', maxX - 16, minY + 10);
          drawArrow(maxX - 16, minY + 22, maxX - 16, maxY - 30);
          drawArcArrow(midX + 12, maxY - 30, 24, 0, Math.PI * 0.85, false);
        } else if (letter === 'M') {
          renderBadge('1', minX + 10, minY + 10);
          drawArrow(minX + 10, minY + 22, minX + 10, maxY - 14);
          renderBadge('2', minX + 14, minY + 12);
          drawArrow(minX + 20, minY + 18, midX, maxY - 20);
          renderBadge('3', maxX - 14, minY + 12);
          drawArrow(maxX - 20, minY + 18, midX, maxY - 20);
          renderBadge('4', maxX - 10, minY + 10);
          drawArrow(maxX - 10, minY + 22, maxX - 10, maxY - 14);
        } else {
          renderBadge('1', minX + 10, minY + 12);
          drawArrow(minX + 10, minY + 24, minX + 10, maxY - 14);
        }
      }
    }

    function spawnSparkles(x, y) {
      for (let i = 0; i < 3; i++) {
        particles.push({
          x: x + (Math.random() - 0.5) * 20,
          y: y + (Math.random() - 0.5) * 20,
          vx: (Math.random() - 0.5) * 2.5,
          vy: (Math.random() - 0.5) * 2.5 - 1,
          size: Math.random() * 8 + 6,
          color: ['#ffeaa7', '#fdcb6e', '#fab1a0', '#ffffff', activeCrayon][Math.floor(Math.random() * 5)],
          alpha: 1,
          life: 25
        });
      }
    }

    function animateParticles() {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 1 / p.life;
        p.size *= 0.95;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        pCtx.save();
        pCtx.globalAlpha = p.alpha;
        pCtx.fillStyle = p.color;
        pCtx.beginPath();
        pCtx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
        pCtx.fill();
        pCtx.restore();
      }
      requestAnimationFrame(animateParticles);
    }
    requestAnimationFrame(animateParticles);

    function playCelebrationChime() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.1 + 0.4);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + i * 0.1);
          osc.stop(audioCtx.currentTime + i * 0.1 + 0.4);
        });
      } catch (e) {}
    }

    function speakText(text, langCode, rate = 0.75, onEndCallback = null) {
      if (!('speechSynthesis' in window)) return;

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = langCode;
      utterance.rate = rate;
      utterance.pitch = 1.05;

      const voices = window.speechSynthesis.getVoices();
      const matched = voices.find(v => v.lang.startsWith(langCode.slice(0, 2)));
      if (matched) utterance.voice = matched;

      if (onEndCallback) {
        utterance.onend = onEndCallback;
      }

      window.speechSynthesis.speak(utterance);
    }

    function playCurrentAudioPaced(onComplete = null) {
      const item = getCurrentItem();
      window.speechSynthesis.cancel();

      speakText(item.letter, item.langCode, 0.7, () => {
        setTimeout(() => {
          speakText(item.phonic, item.langCode, 0.75, onComplete);
        }, 600);
      });
    }

    function getPointerPos(e) {
      const rect = dCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDrawing(e) {
      if (isCompleted) return;
      isDrawing = true;
      const pos = getPointerPos(e);
      drawStroke(pos.x, pos.y, false);
      spawnSparkles(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing || isCompleted) return;
      e.preventDefault();
      const pos = getPointerPos(e);
      drawStroke(pos.x, pos.y, true);
      spawnSparkles(pos.x, pos.y);
    }

    function stopDrawing() {
      if (!isDrawing) return;
      isDrawing = false;
      dCtx.beginPath();
      checkCompletionOnRelease();
    }

    function drawStroke(x, y, isMoving) {
      dCtx.setLineDash([]);
      dCtx.lineWidth = 32;
      dCtx.lineCap = 'round';
      dCtx.lineJoin = 'round';
      dCtx.strokeStyle = activeCrayon;

      if (!isMoving) {
        dCtx.beginPath();
        dCtx.moveTo(x, y);
      }
      dCtx.lineTo(x, y);
      dCtx.stroke();

      const touchRadiusSq = 24 * 24;
      allTargetPoints.forEach(pt => {
        if (!pt.hit) {
          const dx = pt.x - x;
          const dy = pt.y - y;
          if (dx * dx + dy * dy <= touchRadiusSq) {
            pt.hit = true;
          }
        }
      });

      if (allTargetPoints.length > 0) {
        const totalHits = allTargetPoints.filter(p => p.hit).length;
        const pct = Math.min(95, Math.round((totalHits / allTargetPoints.length) * 100));
        document.getElementById('progressBar').style.width = `${pct}%`;
      }
    }

    function checkCompletionOnRelease() {
      if (isCompleted || allTargetPoints.length === 0 || strokeClusters.length === 0) return;

      const totalHits = allTargetPoints.filter(p => p.hit).length;
      const overallRatio = totalHits / allTargetPoints.length;

      let allSegmentsDone = true;
      strokeClusters.forEach(cluster => {
        const clusterHits = cluster.filter(p => p.hit).length;
        if (clusterHits / cluster.length < 0.50) {
          allSegmentsDone = false;
        }
      });

      if (overallRatio >= 0.82 && allSegmentsDone) {
        isCompleted = true;
        document.getElementById('progressBar').style.width = '100%';
        
        playCelebrationChime();
        revealDigitalLetter();

        setTimeout(() => {
          triggerCelebration();
        }, 1200);
      }
    }

    function revealDigitalLetter() {
      const item = getCurrentItem();
      const rect = dCanvas.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;
      const fontSize = calculateBestFontSize(item.letter, width, height);

      dCtx.clearRect(0, 0, width, height);
      dCtx.font = `bold ${fontSize}px sans-serif`;
      dCtx.textAlign = 'center';
      dCtx.textBaseline = 'middle';
      dCtx.fillStyle = activeCrayon;
      dCtx.shadowColor = activeCrayon;
      dCtx.shadowBlur = 14;
      dCtx.fillText(item.letter, width / 2, height / 2 + 4);
      dCtx.shadowBlur = 0;
    }

    function triggerCelebration() {
      const item = getCurrentItem();

      document.getElementById('vocab-letter').textContent = item.letter;
      document.getElementById('vocab-letter').style.color = activeCrayon;
      document.getElementById('vocab-emoji').textContent = item.emoji;
      document.getElementById('vocab-word').textContent = item.word;
      document.getElementById('vocab-phonics').textContent = item.phonic;
      document.getElementById('celebrationCard').classList.add('show');

      playCurrentAudioPaced(() => {
        autoNextTimer = setTimeout(() => {
          nextLetter();
        }, 3000);
      });
    }

    function switchLanguage(lang, e) {
      currentLang = lang;
      currentIndex = 0;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      renderLetter();
    }

    function nextLetter() {
      currentIndex = (currentIndex + 1) % datasets[currentLang].length;
      renderLetter();
    }

    function prevLetter() {
      currentIndex = (currentIndex - 1 + datasets[currentLang].length) % datasets[currentLang].length;
      renderLetter();
    }

    function clearCanvas() {
      renderLetter();
    }

    dCanvas.addEventListener('mousedown', startDrawing);
    dCanvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    dCanvas.addEventListener('touchstart', startDrawing, { passive: false });
    dCanvas.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', stopDrawing);

    window.addEventListener('resize', initCanvasSize);
    window.addEventListener('DOMContentLoaded', () => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {};
      }
      initCanvasSize();
    });
  </script>
</body>
</html>
