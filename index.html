<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kids Alphabet Tracing</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+Devanagari:wght@700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      padding-top: max(6px, env(safe-area-inset-top));
      padding-bottom: max(6px, env(safe-area-inset-bottom));
      color: #2f3e46;
      touch-action: none;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 480px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    header h1 {
      font-size: 1.35rem;
      color: #333;
    }

    .lang-tabs {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .lang-btn {
      flex: 1;
      padding: 6px;
      font-size: 0.95rem;
      font-weight: bold;
      border: 3px solid transparent;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.85);
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.06);
    }

    .lang-btn.active {
      background: #ff7675;
      color: #fff;
      border-color: #d63031;
      transform: translateY(-2px);
    }

    .letter-picker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: #ffffff;
      padding: 4px 12px;
      border-radius: 18px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }

    .nav-arrow {
      background: #74b9ff;
      border: none;
      color: white;
      font-size: 1.2rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 3px #0984e3;
    }

    .nav-arrow:active {
      transform: translateY(3px);
      box-shadow: none;
    }

    .current-letter-display {
      font-size: 1.3rem;
      font-weight: bold;
      color: #2d3436;
      font-family: 'Noto Sans Devanagari', 'Fredoka', sans-serif;
    }

    /* Adaptable Box for both tall candy-bar & square foldables */
    .canvas-wrapper {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 250px;
      max-height: 58vh;
      background: #ffffff;
      border-radius: 22px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      border: 5px solid #ffeaa7;
      overflow: hidden;
      container-type: size;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #drawCanvas { z-index: 2; }
    #particleCanvas { z-index: 3; pointer-events: none; }

    .crayon-palette {
      display: flex;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 2px 0;
    }

    .crayon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 3px 6px rgba(0,0,0,0.18);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .crayon.selected {
      transform: scale(1.2);
      border-color: #2d3436;
    }

    .progress-bar-container {
      width: 100%;
      height: 9px;
      background: #dfe6e9;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #00b894;
      transition: width 0.2s ease-out;
    }

    .action-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .action-btn {
      flex: 1;
      padding: 8px;
      font-size: 0.92rem;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px rgba(0,0,0,0.12);
    }

    .action-btn:active {
      transform: translateY(3px);
      box-shadow: none;
    }

    .btn-clear { background: #fab1a0; color: #d63031; }
    .btn-sound { background: #ffeaa7; color: #d35400; }

    /* Dynamically Scaling Celebration Overlay */
    .celebration-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.98);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.9);
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
      padding: 10px 8px;
      text-align: center;
    }

    .celebration-overlay.show {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    /* Relative font sizing that scales to the canvas dimensions */
    .celebration-letter {
      font-size: min(15cqh, 4.2rem);
      font-weight: 900;
      color: #ff7675;
      line-height: 1;
      font-family: 'Noto Sans Devanagari', 'Fredoka', sans-serif;
      flex-shrink: 0;
    }

    .celebration-emoji {
      font-size: min(20cqh, 5.2rem);
      line-height: 1;
      flex-shrink: 1;
      animation: pulseBounce 0.9s infinite alternate ease-in-out;
    }

    .celebration-word {
      font-size: min(10cqh, 2.2rem);
      font-weight: 800;
      color: #2d3436;
      line-height: 1.1;
      font-family: 'Noto Sans Devanagari', 'Fredoka', sans-serif;
      flex-shrink: 0;
    }

    .celebration-sub {
      font-size: min(6.5cqh, 1.35rem);
      color: #0984e3;
      font-weight: bold;
      font-family: 'Noto Sans Devanagari', 'Fredoka', sans-serif;
      flex-shrink: 0;
    }

    .celebration-timer-text {
      font-size: min(5cqh, 0.9rem);
      color: #2d3436;
      background: #ffeaa7;
      padding: 3px 14px;
      border-radius: 16px;
      font-weight: bold;
      flex-shrink: 0;
    }

    @keyframes pulseBounce {
      0% { transform: scale(0.94); }
      100% { transform: scale(1.12); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🎨 Magic Trace</h1>
    </header>

    <div class="lang-tabs">
      <button class="lang-btn active" onclick="switchLanguage('en', event)">English</button>
      <button class="lang-btn" onclick="switchLanguage('hi', event)">हिंदी</button>
      <button class="lang-btn" onclick="switchLanguage('mr', event)">मराठी</button>
    </div>

    <div class="letter-picker">
      <button class="nav-arrow" onclick="prevLetter()">◀</button>
      <div class="current-letter-display" id="letter-title">A - Apple</div>
      <button class="nav-arrow" onclick="nextLetter()">▶</button>
    </div>

    <div class="canvas-wrapper" id="canvasBox">
      <canvas id="guideCanvas"></canvas>
      <canvas id="drawCanvas"></canvas>
      <canvas id="particleCanvas"></canvas>

      <div class="celebration-overlay" id="celebrationCard">
        <div class="celebration-letter" id="vocab-letter">A</div>
        <div class="celebration-emoji" id="vocab-emoji">🍎</div>
        <div class="celebration-word" id="vocab-word">Apple</div>
        <div class="celebration-sub" id="vocab-phonics">A for Apple</div>
        <div class="celebration-timer-text">Next letter coming up... 🌟</div>
      </div>
    </div>

    <div class="crayon-palette">
      <div class="crayon selected" style="background: #ff7675;" onclick="selectCrayon('#ff7675', this)"></div>
      <div class="crayon" style="background: #fdcb6e;" onclick="selectCrayon('#fdcb6e', this)"></div>
      <div class="crayon" style="background: #00b894;" onclick="selectCrayon('#00b894', this)"></div>
      <div class="crayon" style="background: #0984e3;" onclick="selectCrayon('#0984e3', this)"></div>
      <div class="crayon" style="background: #a29bfe;" onclick="selectCrayon('#a29bfe', this)"></div>
    </div>

    <div class="progress-bar-container">
      <div class="progress-fill" id="progressBar"></div>
    </div>

    <div class="action-row">
      <button class="action-btn btn-clear" onclick="clearCanvas()">🔄 Retry</button>
      <button class="action-btn btn-sound" onclick="playCurrentAudioPaced()">🔊 Hear Sound</button>
    </div>
  </div>

    function unlockAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();

      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();

    function initCanvasSize() {
      const box = document.getElementById('canvasBox');
      const rect = box.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      
      [gCanvas, dCanvas, pCanvas].forEach(c => {
        c.width = rect.width * dpr;
        c.height = rect.height * dpr;
        c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
      });

      renderLetter();
    }

    function getFontFamily() {
      return currentLang === 'en' ? "'Fredoka', sans-serif" : "'Noto Sans Devanagari', sans-serif";
    }

    function calculateBestFontSize(letter, width, height) {
      let size = Math.min(width * 0.65, height * 0.58);
      gCtx.font = `bold ${size}px ${getFontFamily()}`;
      let textWidth = gCtx.measureText(letter).width;
      const maxAllowedWidth = width - 74;

      if (textWidth > maxAllowedWidth) {
        size = size * (maxAllowedWidth / textWidth);
      }
      return size;
    }

    function renderLetter() {
      if (autoNextTimer) clearTimeout(autoNextTimer);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();

      const item = getCurrentItem();
      const box = document.getElementById('canvasBox');
      const width = box.clientWidth;
      const height = box.clientHeight;

      gCtx.clearRect(0, 0, width, height);
      dCtx.clearRect(0, 0, width, height);
      pCtx.clearRect(0, 0, width, height);
      particles = [];

      const fontSize = calculateBestFontSize(item.letter, width, height);
      const fontStr = `bold ${fontSize}px ${getFontFamily()}`;
      const centerX = width / 2;
      const centerY = height / 2 + 4;

      // 1. Hollow Track Shell
      const maskCanvas = document.createElement('canvas');
      maskCanvas.width = width;
      maskCanvas.height = height;
      const mCtx = maskCanvas.getContext('2d');

      mCtx.font = fontStr;

      mCtx.lineJoin = 'round';

      mCtx.strokeText(item.letter, centerX, centerY);
      mCtx.fillStyle = '#2d3436';
      mCtx.fillText(item.letter, centerX, centerY);

      mCtx.globalCompositeOperation = 'destination-out';
      mCtx.lineWidth = 36;
      mCtx.strokeText(item.letter, centerX, centerY);
      mCtx.fillText(item.letter, centerX, centerY);

      gCtx.drawImage(maskCanvas, 0, 0);

      // 2. Centered Dotted Blue Path
      gCtx.font = fontStr;

      document.getElementById('letter-title').textContent = `${item.letter} - ${item.word}`;

    function mapLetterPointsAndBadges(letter, width, height, fontSize, cx, cy) {
      const offCanvas = document.createElement('canvas');
      offCanvas.width = width;
      offCanvas.height = height;
      const offCtx = offCanvas.getContext('2d');

      offCtx.font = `bold ${fontSize}px ${getFontFamily()}`;
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';
      offCtx.fillText(letter, cx, cy);

      const imgData = offCtx.getImageData(0, 0, width, height).data;
      allTargetPoints = [];

      let minX = width, maxX = 0, minY = height, maxY = 0;

      for (let y = 0; y < height; y += 8) {
        for (let x = 0; x < width; x += 8) {
          const index = (y * width + x) * 4;
          if (imgData[index + 3] > 100) {
            allTargetPoints.push({ x, y, hit: false });
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      if (allTargetPoints.length === 0) return;

      strokeClusters = [];
      const stepX = (maxX - minX) / 3;
      const stepY = (maxY - minY) / 3;

      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const x0 = minX + c * stepX;
          const x1 = (c === 2) ? maxX + 1 : x0 + stepX;
          const y0 = minY + r * stepY;
          const y1 = (r === 2) ? maxY + 1 : y0 + stepY;

          const ptsInCell = allTargetPoints.filter(p => p.x >= x0 && p.x < x1 && p.y >= y0 && p.y < y1);
          if (ptsInCell.length >= 5) {
            strokeClusters.push(ptsInCell);
          }
        }
      }

      drawAnatomicalStrokes(letter, minX, maxX, minY, maxY);
    }

    function drawAnatomicalStrokes(letter, minX, maxX, minY, maxY) {
      gCtx.setLineDash([]);
      const midX = (minX + maxX) / 2;
      const midY = (minY + maxY) / 2;

      function renderBadge(num, x, y) {
        gCtx.beginPath();
        gCtx.arc(x, y, 11, 0, Math.PI * 2);
        gCtx.fillStyle = '#0984e3';
        gCtx.fill();
        gCtx.lineWidth = 2;
        gCtx.strokeStyle = '#ffffff';
        gCtx.stroke();

        gCtx.font = 'bold 12px sans-serif';
        gCtx.fillStyle = '#ffffff';
        gCtx.textAlign = 'center';
        gCtx.textBaseline = 'middle';
        gCtx.fillText(num, x, y + 0.5);
      }

      function drawArrow(fromX, fromY, toX, toY) {
        const headlen = 9;
        const angle = Math.atan2(toY - fromY, toX - fromX);

        gCtx.beginPath();
        gCtx.moveTo(fromX, fromY);
        gCtx.lineTo(toX, toY);
        gCtx.strokeStyle = '#d63031';
        gCtx.lineWidth = 2.5;
        gCtx.lineCap = 'round';
        gCtx.stroke();

        gCtx.beginPath();
        gCtx.moveTo(toX, toY);
        gCtx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
        gCtx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
        gCtx.lineTo(toX, toY);
        gCtx.fillStyle = '#d63031';
        gCtx.fill();
      }

      function drawArcArrow(cx, cy, r, startAngle, endAngle, counterClockwise = false) {
        gCtx.beginPath();
        gCtx.arc(cx, cy, r, startAngle, endAngle, counterClockwise);
        gCtx.strokeStyle = '#d63031';
        gCtx.lineWidth = 2.5;
        gCtx.stroke();

        const endX = cx + r * Math.cos(endAngle);
        const endY = cy + r * Math.sin(endAngle);
        const tangent = endAngle + (counterClockwise ? -Math.PI / 2 : Math.PI / 2);
        const headlen = 8;

        gCtx.beginPath();
        gCtx.moveTo(endX, endY);
        gCtx.lineTo(endX - headlen * Math.cos(tangent - Math.PI / 6), endY - headlen * Math.sin(tangent - Math.PI / 6));
        gCtx.lineTo(endX - headlen * Math.cos(tangent + Math.PI / 6), endY - headlen * Math.sin(tangent + Math.PI / 6));
        gCtx.fillStyle = '#d63031';
        gCtx.fill();
      }

      if (currentLang !== 'en') {
        if (['इ', 'ई', 'ड', 'ङ', 'झ', 'ज्ञ', 'ऋ', 'ह'].includes(letter)) {
          renderBadge('1', midX, minY + 14);
          drawArrow(midX, minY + 24, midX, minY + (maxY - minY) * 0.28);
          renderBadge('2', minX + 16, minY + (maxY - minY) * 0.32);
          drawArcArrow(midX + 2, minY + (maxY - minY) * 0.36, 18, -Math.PI / 2, Math.PI / 3, false);
          renderBadge('3', maxX - 18, minY + (maxY - minY) * 0.58);
          drawArcArrow(midX - 2, minY + (maxY - minY) * 0.68, 20, -Math.PI / 4, Math.PI * 0.75, true);
          renderBadge('4', minX + 12, minY + 6);
          drawArrow(minX + 22, minY + 6, maxX - 12, minY + 6);
          if (letter === 'ई') {
            renderBadge('5', midX + 10, minY - 8);
            drawArcArrow(midX + 22, minY - 4, 14, Math.PI, Math.PI * 1.8, false);

        } else if (['अ', 'आ', 'उ', 'ऊ', 'ओ', 'औ', 'अं', 'अः'].includes(letter)) {
          renderBadge('1', minX + 16, minY + (maxY - minY) * 0.22);
          drawArcArrow(minX + 32, minY + (maxY - minY) * 0.24, 18, -Math.PI / 2, Math.PI / 3, false);
          renderBadge('2', minX + 16, minY + (maxY - minY) * 0.54);
          drawArcArrow(minX + 32, minY + (maxY - minY) * 0.56, 20, -Math.PI / 2, Math.PI / 3, false);
          if (['अ', 'आ', 'ओ', 'औ', 'अं', 'अः'].includes(letter)) {
            renderBadge('3', minX + (maxX - minX) * 0.38, midY + 4);
            drawArrow(minX + (maxX - minX) * 0.44, midY + 4, minX + (maxX - minX) * 0.65, midY + 4);
            renderBadge('4', maxX - 18, minY + 16);
            drawArrow(maxX - 18, minY + 26, maxX - 18, maxY - 16);
            renderBadge('5', minX + 12, minY + 6);
            drawArrow(minX + 22, minY + 6, maxX - 12, minY + 6);
          } else {
            renderBadge('3', minX + 12, minY + 6);
            drawArrow(minX + 22, minY + 6, maxX - 12, minY + 6);
          }
        } else if (['ट', 'ठ', 'ढ', 'द'].includes(letter)) {
          renderBadge('1', midX, minY + 14);
          drawArrow(midX, minY + 24, midX, minY + (maxY - minY) * 0.30);
          renderBadge('2', minX + 16, minY + (maxY - minY) * 0.45);
          drawArcArrow(midX, midY + 6, (maxX - minX) * 0.38, -Math.PI / 2, Math.PI * 0.85, false);
          renderBadge('3', minX + 12, minY + 6);
          drawArrow(minX + 22, minY + 6, maxX - 12, minY + 6);
        } else if (letter === 'क') {
          renderBadge('1', midX, minY + 14);
          drawArrow(midX, minY + 24, midX, maxY - 16);
          renderBadge('2', minX + 16, midY - 12);
          drawArcArrow(minX + 32, midY - 6, 16, 0, Math.PI * 1.5, true);
          renderBadge('3', maxX - 14, midY + 4);

          renderBadge('4', minX + 12, minY + 6);
          drawArrow(minX + 22, minY + 6, maxX - 12, minY + 6);
        } else {
          renderBadge('1', minX + 16, minY + 24);
          drawArrow(minX + 16, minY + 34, minX + 16, maxY - 20);
          renderBadge('2', maxX - 18, minY + 16);
          drawArrow(maxX - 18, minY + 26, maxX - 18, maxY - 16);
          renderBadge('3', minX + 12, minY + 6);
          drawArrow(minX + 22, minY + 6, maxX - 12, minY + 6);
        }
      } else {
        if (letter === 'A') {
          renderBadge('1', midX - 8, minY + 12);
          drawArrow(midX - 14, minY + 22, minX + 12, maxY - 12);
          renderBadge('2', midX + 8, minY + 12);
          drawArrow(midX + 14, minY + 22, maxX - 12, maxY - 12);
          renderBadge('3', minX + (maxX - minX) * 0.28, midY + 12);
          drawArrow(minX + (maxX - minX) * 0.36, midY + 12, minX + (maxX - minX) * 0.72, midY + 12);
        } else if (letter === 'B') {
          renderBadge('1', minX + 10, minY + 10);
          drawArrow(minX + 10, minY + 20, minX + 10, maxY - 14);
          renderBadge('2', minX + 26, minY + 8);
          drawArcArrow(midX + 6, minY + (maxY - minY) * 0.28, 22, -Math.PI / 2, Math.PI / 2);

          drawArcArrow(midX + 6, minY + (maxY - minY) * 0.72, 24, -Math.PI / 2, Math.PI / 2);
        } else if (letter === 'C') {
          renderBadge('1', maxX - 14, minY + 18);
          drawArcArrow(midX, midY, (maxX - minX) * 0.40, -Math.PI / 4, Math.PI * 0.85, true);
        } else if (letter === 'D') {
          renderBadge('1', minX + 10, minY + 10);
          drawArrow(minX + 10, minY + 20, minX + 10, maxY - 14);
          renderBadge('2', minX + 26, minY + 8);
          drawArcArrow(midX + 2, midY, (maxX - minX) * 0.42, -Math.PI / 2, Math.PI / 2);
        } else {
          renderBadge('1', minX + 10, minY + 12);
          drawArrow(minX + 10, minY + 22, minX + 10, maxY - 14);
        }

    function spawnSparkles(x, y) {
      for (let i = 0; i < 3; i++) {
        particles.push({
          x: x + (Math.random() - 0.5) * 20,
          y: y + (Math.random() - 0.5) * 20,
          vx: (Math.random() - 0.5) * 2.5,
          vy: (Math.random() - 0.5) * 2.5 - 1,
          size: Math.random() * 8 + 6,
          color: ['#ffeaa7', '#fdcb6e', '#fab1a0', '#ffffff', activeCrayon][Math.floor(Math.random() * 5)],
          alpha: 1,
          life: 25
        });
      }
    }

    function animateParticles() {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 1 / p.life;
        p.size *= 0.95;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        pCtx.save();
        pCtx.globalAlpha = p.alpha;
        pCtx.fillStyle = p.color;
        pCtx.beginPath();
        pCtx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
        pCtx.fill();
        pCtx.restore();
      }
      requestAnimationFrame(animateParticles);
    }
    requestAnimationFrame(animateParticles);

    function playCelebrationChime() {
      unlockAudio();
      try {
        if (!audioContext) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, i) => {
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.15, audioCtxTime() + i * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtxTime() + i * 0.1 + 0.4);
          osc.connect(gain);
          gain.connect(audioContext.destination);
          osc.start(audioCtxTime() + i * 0.1);
          osc.stop(audioCtxTime() + i * 0.1 + 0.4);
        });
      } catch (e) {}
    }

    function audioCtxTime() {
      return audioContext ? audioContext.currentTime : 0;
    }

    function getBestVoice(langCode) {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      const langPrefix = langCode.slice(0, 2);

      const femaleKeywords = ['female', 'google', 'natural', 'kalpana', 'heera', 'samantha', 'victoria', 'kiran', 'swara', 'siri'];
      const matchingVoices = voices.filter(v => v.lang.toLowerCase().replace('_', '-').startsWith(langPrefix));
      
      const bestFemaleVoice = matchingVoices.find(v => {
        const name = v.name.toLowerCase();
        return femaleKeywords.some(kw => name.includes(kw));
      });

      return bestFemaleVoice || matchingVoices[0] || null;
    }

    function speakText(text, langCode, rate = 0.75) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/[-:;,."']/g, ' ').replace(/\s+/g, ' ').trim();
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = langCode;
        utterance.rate = rate;
        utterance.pitch = 1.15;

        const voice = getBestVoice(langCode);
        if (voice) utterance.voice = voice;

        window.speechSynthesis.speak(utterance);
      } catch (e) {}
    }

    function playCurrentAudioPaced() {
      const item = getCurrentItem();
      speakText(item.letter, item.langCode, 0.7);
      setTimeout(() => {
        speakText(item.speechText || item.word, item.langCode, 0.75);
      }, 700);
    }

    function getPointerPos(e) {
      const rect = dCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDrawing(e) {
      unlockAudio();
      if (isCompleted) return;
      isDrawing = true;
      const pos = getPointerPos(e);
      drawStroke(pos.x, pos.y, false);
      spawnSparkles(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing || isCompleted) return;
      e.preventDefault();
      const pos = getPointerPos(e);
      drawStroke(pos.x, pos.y, true);
      spawnSparkles(pos.x, pos.y);
    }

    function stopDrawing() {
      if (!isDrawing) return;
      isDrawing = false;
      dCtx.beginPath();
      checkCompletionOnRelease();
    }

    function drawStroke(x, y, isMoving) {
      dCtx.setLineDash([]);
      dCtx.lineWidth = 32;
      dCtx.lineCap = 'round';
      dCtx.lineJoin = 'round';
      dCtx.strokeStyle = activeCrayon;

      if (!isMoving) {
        dCtx.beginPath();
        dCtx.moveTo(x, y);
      }
      dCtx.lineTo(x, y);
      dCtx.stroke();

      const touchRadiusSq = 28 * 28;
      allTargetPoints.forEach(pt => {
        if (!pt.hit) {
          const dx = pt.x - x;
          const dy = pt.y - y;
          if (dx * dx + dy * dy <= touchRadiusSq) {
            pt.hit = true;
          }
        }
      });

      if (allTargetPoints.length > 0) {
        const totalHits = allTargetPoints.filter(p => p.hit).length;
        const pct = Math.min(95, Math.round((totalHits / allTargetPoints.length) * 100));
        document.getElementById('progressBar').style.width = `${pct}%`;
      }
    }

    function checkCompletionOnRelease() {
      if (isCompleted || allTargetPoints.length === 0 || strokeClusters.length === 0) return;

      const totalHits = allTargetPoints.filter(p => p.hit).length;
      const overallRatio = totalHits / allTargetPoints.length;

      let allSegmentsDone = true;
      strokeClusters.forEach(cluster => {
        const clusterHits = cluster.filter(p => p.hit).length;
        if (clusterHits / cluster.length < 0.42) {
          allSegmentsDone = false;
        }
      });

      if (overallRatio >= 0.78 && allSegmentsDone) {
        isCompleted = true;
        document.getElementById('progressBar').style.width = '100%';
        
        playCelebrationChime();
        revealDigitalLetter();

        setTimeout(() => {
          triggerCelebration();
        }, 1200);
      }
    }

    function revealDigitalLetter() {
      const item = getCurrentItem();
      const box = document.getElementById('canvasBox');
      const width = box.clientWidth;
      const height = box.clientHeight;
      const fontSize = calculateBestFontSize(item.letter, width, height);

      dCtx.clearRect(0, 0, width, height);
      dCtx.font = `bold ${fontSize}px ${getFontFamily()}`;
      dCtx.textAlign = 'center';
      dCtx.textBaseline = 'middle';
      dCtx.fillStyle = activeCrayon;
      dCtx.shadowColor = activeCrayon;
      dCtx.shadowBlur = 14;
      dCtx.fillText(item.letter, width / 2, height / 2 + 4);
      dCtx.shadowBlur = 0;
    }

    function triggerCelebration() {
      const item = getCurrentItem();

      document.getElementById('vocab-letter').textContent = item.letter;
      document.getElementById('vocab-letter').style.color = activeCrayon;
      document.getElementById('vocab-emoji').textContent = item.emoji;
      document.getElementById('vocab-word').textContent = item.word;
      document.getElementById('vocab-phonics').textContent = item.phonic;
      document.getElementById('celebrationCard').classList.add('show');

      playCurrentAudioPaced();

      if (autoNextTimer) clearTimeout(autoNextTimer);
      autoNextTimer = setTimeout(() => {
        nextLetter();
      }, 3500);
    }

    function switchLanguage(lang, e) {
      currentLang = lang;
      currentIndex = 0;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      renderLetter();
    }

    function nextLetter() {
      currentIndex = (currentIndex + 1) % datasets[currentLang].length;
      renderLetter();
    }

    function prevLetter() {
      currentIndex = (currentIndex - 1 + datasets[currentLang].length) % datasets[currentLang].length;
      renderLetter();
    }

    function clearCanvas() {
      renderLetter();
    }

    dCanvas.addEventListener('mousedown', startDrawing);
    dCanvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    dCanvas.addEventListener('touchstart', startDrawing, { passive: false });
    dCanvas.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', stopDrawing);

    const resizeObserver = new ResizeObserver(() => {
      initCanvasSize();
    });
    resizeObserver.observe(document.getElementById('canvasBox'));

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {};
    }

    window.addEventListener('DOMContentLoaded', () => {
      initCanvasSize();
      if (document.fonts) {
        document.fonts.ready.then(() => {
          renderLetter();
        }).catch(() => {});
      }
    });
  </script>
</body>
</html>
