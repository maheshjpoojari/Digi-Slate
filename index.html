<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kids Alphabet Tracing</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      color: #2f3e46;
      touch-action: none;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 1.8rem;
      color: #333;
    }

    /* Language Switcher */
    .lang-tabs {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .lang-btn {
      flex: 1;
      padding: 10px;
      font-size: 1rem;
      font-weight: bold;
      border: 3px solid transparent;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.85);
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.06);
    }

    .lang-btn.active {
      background: #ff7675;
      color: #fff;
      border-color: #d63031;
      transform: translateY(-2px);
    }

    /* Navigation */
    .letter-picker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }

    .nav-arrow {
      background: #74b9ff;
      border: none;
      color: white;
      font-size: 1.4rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 4px #0984e3;
    }

    .nav-arrow:active {
      transform: translateY(4px);
      box-shadow: none;
    }

    .current-letter-display {
      font-size: 1.6rem;
      font-weight: bold;
      color: #2d3436;
    }

    /* Canvas Card */
    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      border: 6px solid #ffeaa7;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Progress Bar */
    .progress-bar-container {
      width: 100%;
      height: 14px;
      background: #dfe6e9;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #00b894;
      transition: width 0.15s ease-out;
    }

    /* Actions */
    .action-row {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .action-btn {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 4px rgba(0,0,0,0.12);
    }

    .btn-clear { background: #fab1a0; color: #d63031; }
    .btn-sound { background: #ffeaa7; color: #d35400; }

    /* Celebration Overlay Card */
    .celebration-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.96);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.85);
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 10;
    }

    .celebration-overlay.show {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .celebration-emoji {
      font-size: 5rem;
      animation: bounce 0.6s infinite alternate ease-in-out;
    }

    .celebration-word {
      font-size: 2.2rem;
      font-weight: bold;
      color: #2d3436;
      margin-top: 8px;
    }

    .celebration-sub {
      font-size: 1.3rem;
      color: #ff7675;
      font-weight: bold;
      margin-top: 4px;
    }

    .auto-next-pill {
      margin-top: 14px;
      background: #e17055;
      color: white;
      font-size: 0.9rem;
      padding: 4px 12px;
      border-radius: 12px;
    }

    @keyframes bounce {
      from { transform: scale(0.9); }
      to { transform: scale(1.15); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🎨 Magic Trace</h1>
    </header>

    <!-- Language Selector -->
    <div class="lang-tabs">
      <button class="lang-btn active" onclick="switchLanguage('en', event)">English</button>
      <button class="lang-btn" onclick="switchLanguage('hi', event)">हिंदी</button>
      <button class="lang-btn" onclick="switchLanguage('mr', event)">मराठी</button>
    </div>

    <!-- Letter Selector -->
    <div class="letter-picker">
      <button class="nav-arrow" onclick="prevLetter()">◀</button>
      <div class="current-letter-display" id="letter-title">A - Apple</div>
      <button class="nav-arrow" onclick="nextLetter()">▶</button>
    </div>

    <!-- Canvas Wrapper -->
    <div class="canvas-wrapper">
      <canvas id="traceCanvas"></canvas>
      
      <!-- Celebratory Popup Overlay -->
      <div class="celebration-overlay" id="celebrationCard">
        <div class="celebration-emoji" id="vocab-emoji">🍎</div>
        <div class="celebration-word" id="vocab-word">Apple</div>
        <div class="celebration-sub" id="vocab-phonics">A for Apple</div>
        <div class="auto-next-pill">Moving to next... ✨</div>
      </div>
    </div>

    <!-- Progress Indicator -->
    <div class="progress-bar-container">
      <div class="progress-fill" id="progressBar"></div>
    </div>

    <!-- Controls -->
    <div class="action-row">
      <button class="action-btn btn-clear" onclick="clearCanvas()">🔄 Clear</button>
      <button class="action-btn btn-sound" onclick="playCurrentAudio()">🔊 Hear Sound</button>
    </div>
  </div>

  <script>
    const datasets = {
      en: [
        { letter: 'A', word: 'Apple', phonic: 'A for Apple', emoji: '🍎', langCode: 'en-US' },
        { letter: 'B', word: 'Ball', phonic: 'B for Ball', emoji: '⚽', langCode: 'en-US' },
        { letter: 'C', word: 'Cat', phonic: 'C for Cat', emoji: '🐱', langCode: 'en-US' },
        { letter: 'D', word: 'Dog', phonic: 'D for Dog', emoji: '🐶', langCode: 'en-US' }
      ],
      hi: [
        { letter: 'अ', word: 'अनार', phonic: 'अ से अनार', emoji: '🍈', langCode: 'hi-IN' },
        { letter: 'आ', word: 'आम', phonic: 'आ से आम', emoji: '🥭', langCode: 'hi-IN' },
        { letter: 'इ', word: 'इमली', phonic: 'इ से इमली', emoji: '🫘', langCode: 'hi-IN' },
        { letter: 'क', word: 'कमल', phonic: 'क से कमल', emoji: '🪷', langCode: 'hi-IN' }
      ],
      mr: [
        { letter: 'अ', word: 'अननस', phonic: 'अ - अननस', emoji: '🍍', langCode: 'mr-IN' },
        { letter: 'क', word: 'कमळ', phonic: 'क - कमळ', emoji: '🪷', langCode: 'mr-IN' },
        { letter: 'घ', word: 'घर', phonic: 'घ - घर', emoji: '🏠', langCode: 'mr-IN' },
        { letter: 'ळ', word: 'बाळ', phonic: 'ळ - बाळ', emoji: '👶', langCode: 'mr-IN' }
      ]
    };

    let currentLang = 'en';
    let currentIndex = 0;
    let isDrawing = false;
    let isCompleted = false;
    let autoNextTimer = null;

    const canvas = document.getElementById('traceCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    let targetPixelPoints = [];
    let hitCount = 0;

    function initCanvasSize() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      renderLetter();
    }

    function getCurrentItem() {
      return datasets[currentLang][currentIndex];
    }

    function renderLetter() {
      if (autoNextTimer) clearTimeout(autoNextTimer);
      
      const item = getCurrentItem();
      const rect = canvas.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;

      ctx.clearRect(0, 0, width, height);

      // Letter text size
      const fontSize = Math.min(width, height) * 0.62;
      ctx.font = `bold ${fontSize}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Draw light gray dashed guide letter
      ctx.setLineDash([10, 14]);
      ctx.lineWidth = 8;
      ctx.strokeStyle = '#b2bec3';
      ctx.strokeText(item.letter, width / 2, height / 2 + 8);

      // Soft fill under the guide
      ctx.fillStyle = 'rgba(238, 238, 238, 0.4)';
      ctx.fillText(item.letter, width / 2, height / 2 + 8);

      // Precalculate sparse target hitpoints
      mapSparseLetterPoints(item.letter, width, height, fontSize);

      document.getElementById('letter-title').textContent = `${item.letter} - ${item.word}`;
      document.getElementById('progressBar').style.width = '0%';
      document.getElementById('celebrationCard').classList.remove('show');
      isCompleted = false;
      hitCount = 0;
    }

    // Creates an array of point coordinates covering the letter
    function mapSparseLetterPoints(letter, width, height, fontSize) {
      const offCanvas = document.createElement('canvas');
      offCanvas.width = width;
      offCanvas.height = height;
      const offCtx = offCanvas.getContext('2d');

      offCtx.font = `bold ${fontSize}px sans-serif`;
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';
      offCtx.fillText(letter, width / 2, height / 2 + 8);

      const imgData = offCtx.getImageData(0, 0, width, height).data;
      targetPixelPoints = [];

      // Step by 16px to create forgiving checkpoints
      for (let y = 0; y < height; y += 16) {
        for (let x = 0; x < width; x += 16) {
          const index = (y * width + x) * 4;
          if (imgData[index + 3] > 120) {
            targetPixelPoints.push({ x, y, hit: false });
          }
        }
      }
    }

    // Audio Player with Web Speech API
    function playAudio(text, langCode) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = langCode;
      utterance.rate = 0.85;
      utterance.pitch = 1.1;

      const voices = window.speechSynthesis.getVoices();
      const matched = voices.find(v => v.lang.startsWith(langCode.slice(0, 2)));
      if (matched) utterance.voice = matched;

      window.speechSynthesis.speak(utterance);
    }

    function playCurrentAudio() {
      const item = getCurrentItem();
      playAudio(item.phonic, item.langCode);
    }

    // Pointer & Touch Controls
    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDrawing(e) {
      if (isCompleted) return;
      isDrawing = true;
      const pos = getPointerPos(e);
      drawStroke(pos.x, pos.y, false);
    }

    function draw(e) {
      if (!isDrawing || isCompleted) return;
      e.preventDefault();
      const pos = getPointerPos(e);
      drawStroke(pos.x, pos.y, true);
    }

    function stopDrawing() {
      isDrawing = false;
      ctx.beginPath();
    }

    function drawStroke(x, y, isMoving) {
      ctx.setLineDash([]);
      ctx.lineWidth = 36; // Thick stroke for toddlers
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#ff7675';

      if (!isMoving) {
        ctx.beginPath();
        ctx.moveTo(x, y);
      }
      ctx.lineTo(x, y);
      ctx.stroke();

      // Check hits within touch radius (34px)
      const touchRadiusSq = 34 * 34;
      for (let i = 0; i < targetPixelPoints.length; i++) {
        const pt = targetPixelPoints[i];
        if (!pt.hit) {
          const dx = pt.x - x;
          const dy = pt.y - y;
          if (dx * dx + dy * dy <= touchRadiusSq) {
            pt.hit = true;
            hitCount++;
          }
        }
      }

      updateProgress();
    }

    function updateProgress() {
      if (targetPixelPoints.length === 0) return;
      
      // Target 55% coverage for toddlers to complete easily
      const completionFraction = hitCount / (targetPixelPoints.length * 0.55);
      const progressPercent = Math.min(100, Math.round(completionFraction * 100));
      document.getElementById('progressBar').style.width = `${progressPercent}%`;

      if (progressPercent >= 100 && !isCompleted) {
        triggerSuccess();
      }
    }

    function triggerSuccess() {
      isCompleted = true;
      const item = getCurrentItem();

      // Display Pop-up Word & Emoji
      document.getElementById('vocab-emoji').textContent = item.emoji;
      document.getElementById('vocab-word').textContent = item.word;
      document.getElementById('vocab-phonics').textContent = item.phonic;
      document.getElementById('celebrationCard').classList.add('show');

      // Play Phonetic Sound
      playCurrentAudio();

      // Auto-advance to next letter after 2.5 seconds
      autoNextTimer = setTimeout(() => {
        nextLetter();
      }, 2500);
    }

    // Navigation Controls
    function switchLanguage(lang, e) {
      currentLang = lang;
      currentIndex = 0;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      renderLetter();
    }

    function nextLetter() {
      currentIndex = (currentIndex + 1) % datasets[currentLang].length;
      renderLetter();
    }

    function prevLetter() {
      currentIndex = (currentIndex - 1 + datasets[currentLang].length) % datasets[currentLang].length;
      renderLetter();
    }

    function clearCanvas() {
      renderLetter();
    }

    // Event listeners
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', stopDrawing);

    window.addEventListener('resize', initCanvasSize);
    window.addEventListener('DOMContentLoaded', () => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {};
      }
      initCanvasSize();
    });
  </script>
</body>
</html>
